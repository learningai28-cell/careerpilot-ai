name: Deploy Supabase Edge Functions

# Replaces the old hand-pasted copies in the Supabase Dashboard, so the code
# running in production is always exactly what is in git.
#   push to main    -> production project
#   push to staging -> staging project
on:
  push:
    branches: [main, staging]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys of the same environment at once; let the newer
# commit queue up rather than killing a deploy that is already mid-flight.
concurrency:
  group: supabase-functions-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Staging branch uses the staging project; anything else (main, or a
      # manual run from another branch) uses production.
      PROJECT_REF: ${{ github.ref_name == 'staging' && secrets.SUPABASE_STAGING_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
    steps:
      # Secrets can't be used directly in `if:`, so check them in shell and
      # expose the answer. A missing secret should skip, not fail, so a
      # not-yet-configured staging doesn't show red builds.
      - id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Skipping: SUPABASE_ACCESS_TOKEN and the project ref secret for this branch (SUPABASE_PROJECT_REF, or SUPABASE_STAGING_PROJECT_REF on staging) are not both set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.check.outputs.run == 'true'
        uses: supabase/setup-cli@v1
        with:
          # Pinned so a new CLI release can't change deploy behaviour
          # unexpectedly. Bump deliberately.
          version: 2.120.0

      # Guard against the one misconfiguration that silently breaks payments:
      # razorpay-webhook deployed with JWT verification on.
      - if: steps.check.outputs.run == 'true'
        run: |
          if [ -d supabase/functions/razorpay-webhook ]; then
            grep -A1 '^\[functions.razorpay-webhook\]' supabase/config.toml | grep -q 'verify_jwt = false' \
              || { echo "::error::supabase/config.toml must set verify_jwt = false for razorpay-webhook"; exit 1; }
          fi

      # No function name = deploy every function folder (folders starting
      # with "_" such as _shared are helpers, not functions). verify_jwt
      # comes from supabase/config.toml.
      - if: steps.check.outputs.run == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"
