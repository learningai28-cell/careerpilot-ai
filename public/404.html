<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CareerPilot AI</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages has no server-side routing, so a hard refresh (or a
      // shared link) on a client-side route like /dashboard/billing hits
      // GitHub's static host directly, finds no matching file, and serves
      // this 404 page instead of the app. This script rewrites that URL
      // into a query string and redirects to the site root, where
      // index.html's restoration script decodes it back into the real
      // path before React Router mounts — so the user lands on the page
      // they actually asked for instead of a dead end.
      //
      // pathSegmentsToKeep = 1 preserves the "/careerpilot-ai" segment
      // when served from the raw github.io subpath (pre-custom-domain);
      // 0 when served from the custom domain root.
      var pathSegmentsToKeep =
        window.location.hostname.indexOf("github.io") !== -1 ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
